<ion-header mode="md" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{
      visitor ? "Actualizar visitante" : "Crear visitante"
    }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <figure class="image-container flex justify-center items-center">
    <ion-icon
      class="w-20 h-20 text-primary"
      name="person-circle-outline"
    ></ion-icon>
  </figure>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-list
      lines="none"
      class="ion-no-padding"
      class="flex flex-col items-center w-full md:w-1/3 lg:w-1/4 md:mx-auto h-4/12 h-4/12 bg-transparent"
    >
      <div class="px-6 flex flex-col mt-4 gap-4 w-full">
        <app-input
          formControlName="document"
          label="Documento"
          placeholder="123456789"
          type="number"
        ></app-input>
        <app-input
          formControlName="first_name"
          label="Nombre"
          placeholder="Pablo"
        ></app-input>
        <app-input
          formControlName="last_name"
          label="Apellido"
          placeholder="Perez"
        ></app-input>
        <!-- <div class="flex justify-between items-center w-full mt-4">
          <ion-checkbox
            formControlName="active"
            class="font-light text-sm text-gray-500"
            mode="md"
            labelPlacement="end"
            >Activo</ion-checkbox
          >
        </div> -->

        @if(form.get('is_supplier')?.value) {
        <app-input
          formControlName="company_name"
          label="Compañía (opcional)"
          placeholder="Company ABC"
        ></app-input>
        }
      </div>
      <ion-button
        type="submit"
        mode="ios"
        class="text-white mt-4"
        expand="block"
        [disabled]="!form.valid"
      >
        {{ visitor ? "Actualizar" : "Registrar visitante" }}
      </ion-button>
    </ion-list>
  </form>
</ion-content>
